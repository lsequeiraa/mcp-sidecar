name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Cross-compile binaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin  GOARCH=arm64 go build -o npm/@mcp-sidecar/darwin-arm64/bin/mcp-sidecar .
          GOOS=darwin  GOARCH=amd64 go build -o npm/@mcp-sidecar/darwin-x64/bin/mcp-sidecar .
          GOOS=linux   GOARCH=arm64 go build -o npm/@mcp-sidecar/linux-arm64/bin/mcp-sidecar .
          GOOS=linux   GOARCH=amd64 go build -o npm/@mcp-sidecar/linux-x64/bin/mcp-sidecar .
          GOOS=windows GOARCH=amd64 go build -o npm/@mcp-sidecar/win32-x64/mcp-sidecar.exe .

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in npm/mcp-sidecar npm/@mcp-sidecar/*/; do
            npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix "$dir"
          done
          # Update optionalDependencies in the main package to match
          node -e "
            const fs = require('fs');
            const p = 'npm/mcp-sidecar/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Stage README and LICENSE for platform packages
        run: |
          for dir in npm/@mcp-sidecar/*/; do
            pkg_name=$(node -p "require('./${dir}package.json').name")
            cat > "${dir}README.md" <<EOF
          # ${pkg_name}

          Platform-specific binary for [mcp-sidecar](https://www.npmjs.com/package/mcp-sidecar).

          Do not install this package directly. Install \`mcp-sidecar\` instead, and the
          correct platform binary will be selected automatically via
          [\`optionalDependencies\`](https://docs.npmjs.com/cli/v10/configuring-npm/package-json#optionaldependencies).

          Source: https://github.com/lsequeiraa/mcp-sidecar
          EOF
            cp LICENSE "${dir}LICENSE"
          done

      - name: Publish platform packages
        run: |
          for dir in npm/@mcp-sidecar/*/; do
            npm publish "$dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage README and LICENSE for npm package
        run: |
          cp README.md npm/mcp-sidecar/README.md
          cp LICENSE   npm/mcp-sidecar/LICENSE

      - name: Publish main package
        run: npm publish ./npm/mcp-sidecar --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync version in .mcp/server.json from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const p = '.mcp/server.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf8'));
            s.version = '${VERSION}';
            for (const pkg of s.packages || []) { pkg.version = '${VERSION}'; }
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + '\n');
          "

      - name: Validate server.json
        run: ./mcp-publisher validate .mcp/server.json

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish .mcp/server.json
